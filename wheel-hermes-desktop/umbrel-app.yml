manifestVersion: 1.1
id: wheel-hermes-desktop
storage:
  dataRoot: data
category: networking
name: Hermes Desktop Bridge
version: "0.1.2"
tagline: Private Tailscale backend for Hermes Desktop
description: >-
  A companion backend that runs hermes serve independently of the official
  Hermes Agent compose. It binds only a private listen address supplied after
  install, shares the Hermes home, requires an umbrelOS-managed isolated
  vault mount, and does not start a second messaging gateway.
developer: Wheel Dashboard contributors
website: ""
dependencies: []
repo: ""
support: ""
port: 19120
icon: icon.png
gallery: []
releaseNotes: >-
  Removes the hardcoded cross-app Obsidian bind. The companion now requires
  the isolated Hermes Vault through an umbrelOS-managed custom mount and
  fails closed when that exact mount is absent. The official Hermes Agent
  0.23.2 image and private listener settings are unchanged.
path: ""
defaultUsername: ""
defaultPassword: ""
deterministicPassword: false
torOnly: false
submitter: Ken
submission: ""
