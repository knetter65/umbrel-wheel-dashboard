support: ""
port: 19120
icon: icon.png
gallery: []
releaseNotes: >-
  Updates the companion runtime to the official Hermes Agent 0.23.4 Umbrel
  image. Private listener settings, the permanent port, and narrow mounts are
  unchanged.
