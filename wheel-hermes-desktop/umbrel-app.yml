manifestVersion: 1.1
id: wheel-hermes-desktop
storage:
  dataRoot: data
category: networking
name: Hermes Desktop Bridge
version: "0.1.4"
tagline: Private Tailscale backend for Hermes Desktop
description: >-
  A companion backend that runs hermes serve independently of the official
  Hermes Agent compose. It binds only a private listen address supplied after
  install, shares the Hermes home, requires an umbrelOS-managed isolated
  vault mount, and does not start a second messaging gateway.
