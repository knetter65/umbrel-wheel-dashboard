services:
  app_proxy:
    environment:
      APP_HOST: wheel-hermes-desktop_status_1
      APP_PORT: 8080

  serve:
    image: ghcr.io/getumbrel/hermes-agent-umbrel:v0.23.1@sha256:b7976dc05ed1348011c82bff15f04064eee53e307839337c9eec0b47af79b4f1
    init: true
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 15s
    network_mode: host
    environment:
      HOME: /opt/data
      HERMES_HOME: /opt/data
      HERMES_DESKTOP_BOOTSTRAP_B64: ""
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1m,uid=1000,gid=1000,mode=0700
    entrypoint:
      - /opt/hermes/.venv/bin/python3
      - -c
      - "import base64,os; p='/tmp/serve_bootstrap.py'; open(p,'wb').write(base64.b64decode(os.environ.pop('HERMES_DESKTOP_BOOTSTRAP_B64'))); os.execv('/opt/hermes/.venv/bin/python3',['python3',p])"
    volumes:
      - type: bind
        source: /home/umbrel/umbrel/app-data/hermes-agent/data/hermes
        target: /opt/data
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: /home/umbrel/umbrel/app-data/obsidian/data/config/Obsidian Vault/Hermes Vault
        target: /obsidian/Obsidian Vault/Hermes Vault
        read_only: false
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - /opt/hermes/.venv/bin/python3
        - -c
        - "import ipaddress,os,socket; h=os.environ['HERMES_DESKTOP_LISTEN_HOST']; p=int(os.environ['HERMES_DESKTOP_LISTEN_PORT']); a=ipaddress.ip_address(h); s=socket.socket(socket.AF_INET6 if a.version==6 else socket.AF_INET); s.settimeout(3); s.connect((h,p,0,0) if a.version==6 else (h,p)); s.close()"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    container_name: wheel-hermes-desktop_serve_1

  status:
    image: python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
    init: true
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    environment:
      STATUS_PORT: "8080"
      HERMES_DESKTOP_STATUS_B64: ""
    ports:
      - 127.0.0.1:19121:8080
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1m,uid=1000,gid=1000,mode=0700
    entrypoint:
      - python3
      - -c
      - "import base64,os; p='/tmp/status_server.py'; open(p,'wb').write(base64.b64decode(os.environ.pop('HERMES_DESKTOP_STATUS_B64'))); os.execv('/usr/local/bin/python3',['python3',p])"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()==b'ok\\n'"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    container_name: wheel-hermes-desktop_status_1
