name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.6"
      - run: uv sync --frozen --dev
      - name: Test with an isolated fixture database
        shell: bash
        run: |
          test_root="$(mktemp -d "${RUNNER_TEMP}/wheel-dashboard-tests.XXXXXX")"
          trap 'rm -rf -- "$test_root"' EXIT
          WHEEL_DASHBOARD_DATA_DIR="$test_root/data" uv run python -m unittest discover -s tests -v
      - run: uv run python -m compileall -q src tests scripts
      - run: uv run python scripts/scan_publication.py .
      - name: Verify tests left the release tree unchanged
        shell: bash
        run: |
          git diff --exit-code -- .
          test -z "$(git ls-files --others --exclude-standard)"
  publish-private-ghcr:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'knetter65/umbrel-wheel-dashboard'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=min
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          tags: ghcr.io/knetter65/wheel-dashboard:0.3.0
